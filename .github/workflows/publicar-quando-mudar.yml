# Publica o site quando os dados públicos do banco mudam, inclusive por edição direta no Supabase.
# Só roda no branch padrão (agendamento). O segredo VERCEL_DEPLOY_HOOK fica em Settings > Secrets > Actions.
name: Publicar site quando os dados mudarem

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicacao-site
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Restaurar estado da última verificação
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: estado
          key: estado-publicacao-${{ github.run_id }}
          restore-keys: estado-publicacao-

      - name: Comparar dados com o último estado
        id: verificar
        env:
          # Papel build_publico (só executa catalogo_slugs()) e CA fixada do Postgres. Nunca a service_role.
          SUPABASE_BUILD_DB_URL: ${{ secrets.SUPABASE_BUILD_DB_URL }}
          SUPABASE_DB_CA: ${{ secrets.SUPABASE_DB_CA }}
        run: node scripts/verifica-alteracoes.mjs

      - name: Disparar publicação na Vercel
        if: steps.verificar.outputs.publicar == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then echo "Segredo VERCEL_DEPLOY_HOOK ausente."; exit 1; fi
          curl -fsS -X POST -o /dev/null "$DEPLOY_HOOK"
          echo "Publicação disparada."

      - name: Salvar estado para a próxima verificação
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: estado
          key: estado-publicacao-${{ github.run_id }}
